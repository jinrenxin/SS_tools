<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>yaya · 鸭鸭图解码器</title>
  <style>
    :root { --bg:#f7f6ee; --card:#fffef9; --ink:#29352c; --muted:#637066; --accent:#237653; --line:#dce2d4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:24px 16px; color:var(--ink); font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; background:radial-gradient(circle at 10% 10%,#f4d78c55,transparent 36%),radial-gradient(circle at 88% 92%,#8bc4a94d,transparent 30%),linear-gradient(130deg,var(--bg),#e9f0e8); }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible { outline:3px solid #d49a2a; outline-offset:4px; }
    .wrap { width:min(980px,100%); margin:auto; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 24px 48px #14221818; overflow:hidden; }
    .head { padding:24px; border-bottom:1px dashed var(--line); }
    .brand { display:flex; align-items:center; gap:12px; }
    .duck { display:grid; place-items:center; width:48px; height:48px; border-radius:15px; background:#fff0b8; font-size:30px; flex-shrink:0; }
    .eyebrow { margin:0 0 4px; color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.16em; }
    h1 { margin:0; font-size:1.35rem; letter-spacing:.02em; }
    .sub { margin:14px 0 0; color:var(--muted); font-size:.9rem; line-height:1.7; }
    .row { padding:18px 24px; border-bottom:1px dashed var(--line); }
    label { display:block; margin-bottom:8px; font-size:.9rem; font-weight:600; }
    label span { color:var(--muted); font-weight:400; }
    .password-row { display:flex; gap:8px; }
    #password { width:100%; min-width:0; padding:11px 12px; border:1px solid var(--line); border-radius:10px; outline:none; background:white; }
    #password:focus { border-color:var(--accent); box-shadow:0 0 0 3px #23765320; }
    .btn { border:0; border-radius:10px; padding:10px 16px; color:white; font-size:.88rem; font-weight:700; background:linear-gradient(135deg,var(--accent),#339368); }
    .btn.secondary { color:#4b594e; background:#edf0e8; }
    .password-row .btn { flex-shrink:0; }
    .drop { border:2px dashed #bbc9b6; border-radius:14px; padding:26px 14px; text-align:center; background:#fafcf6; transition:background .2s,border-color .2s; cursor:pointer; }
    .drop.dragover { border-color:var(--accent); background:#edf7ef; }
    .upload-icon { display:block; margin:0 auto 10px; color:var(--accent); }
    .drop strong { display:block; margin-bottom:8px; font-size:1rem; }
    .drop small { color:var(--muted); line-height:1.6; }
    .btnline { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:16px; }
    .hint { margin:12px 0 0; color:var(--muted); font-size:.8rem; line-height:1.7; text-align:center; }
    .status { margin-top:16px; font-size:.85rem; color:var(--accent); }
    .log { margin:10px 0 0; padding:12px; max-height:160px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; border:1px solid var(--line); border-radius:10px; background:#fbfcf8; color:var(--muted); font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .results-heading { display:flex; align-items:center; justify-content:space-between; padding:20px 24px 0; }
    h2 { margin:0; font-size:1rem; }
    .count { color:var(--muted); font-size:.8rem; }
    .grid { padding:16px 24px 24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr)); gap:14px; }
    .empty { grid-column:1/-1; padding:32px 14px; border:1px dashed var(--line); border-radius:12px; text-align:center; color:var(--muted); background:#f8faf4; font-size:.9rem; line-height:1.8; }
    .card { min-width:0; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:white; }
    .thumb,.thumb-video,.file-preview,.text-preview { width:100%; height:220px; margin:0; background:#eef2e9; }
    .thumb { display:block; object-fit:contain; cursor:zoom-in; }
    .thumb-video { display:block; background:#18201b; }
    .file-preview { display:grid; place-items:center; color:var(--muted); }
    .text-preview { padding:14px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font:13px/1.7 ui-monospace,Consolas,monospace; }
    .audio-preview { width:100%; margin:20px 0; }
    .meta { padding:12px; flex:1; color:var(--muted); font-size:12px; line-height:1.8; overflow-wrap:anywhere; }
    .name { margin-bottom:6px; color:var(--ink); font-size:13px; font-weight:700; }
    .actions { display:flex; gap:8px; padding:0 12px 12px; }
    .actions .btn { flex:1; padding:8px 10px; font-size:12px; }
    .footer { padding:0 24px 20px; text-align:center; color:var(--muted); font-size:12px; }
    dialog { max-width:calc(100vw - 24px); max-height:calc(100dvh - 24px); padding:12px; border:0; border-radius:14px; background:#fffef9; }
    dialog::backdrop { background:#101b17d9; }
    .modal-toolbar { display:flex; justify-content:flex-end; margin-bottom:10px; }
    dialog img { display:block; max-width:100%; max-height:calc(100dvh - 110px); object-fit:contain; margin:auto; }
    @media(max-width:640px) { body { padding:12px 8px; } .head,.row { padding:18px 14px; } .results-heading { padding:18px 14px 0; } .grid { padding:14px; } h1 { font-size:1.14rem; } }
  </style>
  <link rel="stylesheet" href="vendor/viewer.min.css">
  <script src="vendor/viewer.min.js" defer></script>
  <script src="decoder.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="brand"><span class="duck" aria-hidden="true">🦆</span><div><p class="eyebrow">YAYA · LOCAL DECODER</p><h1>鸭鸭图解码器</h1></div></div>
      <p class="sub">把鸭鸭图里的内容找回来。先填写密码，再放入图片，即可预览和下载原始文件。</p>
    </header>
    <section class="row" aria-label="解码密码">
      <label for="password">解码密码 <span>／ 无密码可留空</span></label>
      <div class="password-row"><input id="password" type="password" placeholder="先输入密码，再拖入或选择图片" autocomplete="off" spellcheck="false"><button id="togglePassword" class="btn secondary" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div>
    </section>
    <section class="row" aria-label="选择鸭鸭图">
      <div id="dropZone" class="drop" tabindex="0" role="button" aria-label="选择或拖入鸭鸭图，支持多张图片">
        <svg class="upload-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg>
        <strong>拖入鸭鸭图，或点击选择图片</strong>
        <small>支持多图批量 · 选择后自动解码 · Ctrl / ⌘ + V 粘贴图片</small>
      </div>
      <div class="btnline"><button id="pickBtn" class="btn" type="button">选择图片</button><button id="clearBtn" class="btn secondary" type="button">清空结果</button></div>
      <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,.png,.jpg,.jpeg,.webp,.bmp" multiple hidden>
      <p class="hint">请使用原始 PNG 鸭鸭图；截图、缩放或有损压缩会破坏隐藏数据。自动识别全部三档编码。</p>
      <div id="status" class="status" role="status" aria-live="polite">等待添加图片</div>
      <pre id="log" class="log" role="log" aria-label="解码日志" hidden></pre>
    </section>
    <div class="results-heading"><h2>解码结果</h2><span id="resultCount" class="count">0 个文件</span></div>
    <section id="resultGrid" class="grid" aria-label="解码结果"><div class="empty">暂无解码结果<br>图片、视频和文本会显示在这里</div></section>
    <footer class="footer">所有解码均在当前浏览器本地完成，图片和密码不会上传。</footer>
  </main>
  <dialog id="imgModal" aria-label="解码图片预览"><div class="modal-toolbar"><button id="closeModal" class="btn secondary" type="button">关闭预览 · Esc</button></div><img id="modalImg" alt="解码图片预览"></dialog>
</body>
</html>
